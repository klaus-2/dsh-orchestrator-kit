name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Test suite (run 1)
        run: node scripts/test.mjs
      - name: Test suite (run 2, anti-flake)
        run: node scripts/test.mjs
      - name: Verify pack whitelist
        run: npm pack --dry-run

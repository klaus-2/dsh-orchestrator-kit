name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Test suite
        run: node scripts/test.mjs
      - name: Coverage gate
        run: |
          NODE_V8_COVERAGE=${{ runner.temp }}/dsh-coverage node scripts/test.mjs
          NODE_V8_COVERAGE=${{ runner.temp }}/dsh-coverage-report node scripts/test.mjs --coverage-report --coverage-dir=${{ runner.temp }}/dsh-coverage
      - name: Verify pack whitelist
        run: npm pack --dry-run
      - name: Publish to npm
        if: vars.NPM_PUBLISH_VIA_CI == 'true'
        run: npm publish
